[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra -p no:cacheprovider
markers =
    podman: test requires a temporary Podman stack
    rag: test requires the RAG API container (--include-rag or --all)
    reranker: test requires the reranker container (--include-reranker or --all)
    ollama: test requires host Ollama (--include-ollama or --all)
