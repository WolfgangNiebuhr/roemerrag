apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: experimental
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    echo "Installiere Systemabhängigkeiten..."
    apt-get update && apt-get install -y --no-install-recommends \
        ca-certificates \
        procps \
        curl \
        && rm -rf /var/lib/apt/lists/*
    update-ca-certificates

    echo "Kopiere Zertifikate..."
    mkdir -p /usr/local/share/ca-certificates
    cp /security/DATEV-HTTPSPROXY-ROOT-01.pem /usr/local/share/ca-certificates/HTTPSPROXY_ROOT.crt
    update-ca-certificates

    echo "Installiere Python-Abhängigkeiten..."
    pip install --no-cache-dir -r /app/requirements.txt

    echo "Konfiguriere Zertifikate..."
    mkdir -p ~/.pip
    cp /security/pip.conf ~/.pip/pip.conf
    cat /security/cacerts.pem >> $(python3 -m certifi)

    echo "Starte die Anwendung..."
    python /app/app.py
    
  requirements.txt: |
    flask
    certifi
    requests
    numpy

  app.py: |
    from flask import Flask, request, jsonify
    import requests
    import numpy as np

    app = Flask(__name__)

    # Konfiguration

    ## Embedding
    OLLAMA_EMBEDDING_URL = "http://ollama:11434/api/embeddings"
    EMBEDDING_MODEL_NAME = "snowflake-arctic-embed2"

    ## Retrieval
    VECTOR_API_URL = "http://vector-api:5500/search"
    NUM_RESULTS = 5

    ## Generation
    OLLAMA_ANSWER_URL = "http://ollama:11434/api/generate"
    ANSWER_MODEL_NAME = "phi3:mini"

    QUERY = "Wer beherrschte die westliche Hälfte des Mittelmeeres?"

    def generate_embedding(query):
        """Erzeugt ein Embedding für die vordefinierte Frage über die Ollama-API."""
        payload = {
            "model": EMBEDDING_MODEL_NAME,
            "prompt": query
        }
        response = requests.post(OLLAMA_EMBEDDING_URL, json=payload)
        if response.status_code == 200:
            vec = np.array(response.json().get("embedding"))
            vec = vec / np.linalg.norm(vec)  # Normalisierung des Embeddings
            return vec
        else:
            raise Exception(f"Fehler beim Abrufen des Embeddings: {response.text}")

    def search_vectors(embedding, filter, metric, num_results):
        """Führt eine Suche über die Vektor-API aus und gibt die besten Treffer zurück."""
        payload = {
            "vector": embedding.tolist(),
            "embedding": filter,
            "num_results": num_results,
            "metric": metric
        }
        response = requests.post(VECTOR_API_URL, json=payload)
        if response.status_code == 200:
            results = response.json()
            if isinstance(results, list):
                return results
            else:
                raise Exception("Unerwartetes Antwortformat: Erwartet wurde eine Liste.")
        else:
            raise Exception(f"Fehler bei der Suche in der Vektor-API: {response.text}")

    def generate_answer(context, question):
        system_prompt = (
            "Du bist ein Experte für römische Geschichte. Beantworte Fragen nur basierend auf den "
            "als Kontext übergebenen Dokumenten. Wenn die Frage nicht beantwortet werden kann, "
            "antworte mit 'Die Frage kann basierend auf dem gegebenen Kontext nicht beantwortet werden.'"
        )
        payload = {
            "model": ANSWER_MODEL_NAME,
            "stream": False,
            "system": system_prompt,
            "prompt": f"Kontext:\n{context}\n\nFrage: {question}"
        }
        response = requests.post(OLLAMA_ANSWER_URL, json=payload)
        if response.status_code != 200:
            raise Exception(f"Fehler bei der Antwortgenerierung: {response.text}")

        data = response.json()
        answer = data.get("response", "Keine Antwort erhalten.")
        metrics = {
            "total_duration": data.get("total_duration", 0) / 1e9,
            "load_duration": data.get("load_duration", 0) / 1e9,
            "prompt_eval_duration": data.get("prompt_eval_duration", 0) / 1e9,
            "eval_duration": data.get("eval_duration", 0) / 1e9,
            "prompt_tokens": data.get("prompt_eval_count", 0),
            "answer_tokens": data.get("eval_count", 0),
            "answer_rate": data.get("eval_count", 0) / (data.get("eval_duration", 1) / 1e9)
        }
        return answer, metrics

    @app.route('/process', methods=['POST'])
    def process_request():
        try:
            data = request.json
            query = data.get("query")
            filter = data.get("filter", "snowflake-arctic-embed2")
            metric = data.get("metric", "euclidean")
            num_results = data.get("num_results", 5)

            if not query:
                return jsonify({"error": "Query ist erforderlich"}), 400

            embedding = generate_embedding(query)
            results = search_vectors(embedding, filter, metric, num_results)

            context = "\n".join([result["metadata"] for result in results])
            second_elements = [result["chunk_id"] for result in results]

            answer, metrics = generate_answer(context, query)

            response = {
                "response": answer,
                "metrics": metrics,
                "chunks": second_elements
            }
            return jsonify(response), 200

        except Exception as e:
            return jsonify({"error": str(e)}), 500

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5600)
