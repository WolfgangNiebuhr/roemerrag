apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorapi-config
  namespace: experimental
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    echo "Installiere Systemabhängigkeiten..."
    apt-get update && apt-get install -y --no-install-recommends \
        ca-certificates \
        procps \
        curl \
        && rm -rf /var/lib/apt/lists/*
    update-ca-certificates

    echo "Kopiere Zertifikate..."
    mkdir -p /usr/local/share/ca-certificates
    cp /security/DATEV-HTTPSPROXY-ROOT-01.pem /usr/local/share/ca-certificates/HTTPSPROXY_ROOT.crt
    update-ca-certificates

    echo "Installiere Python-Abhängigkeiten..."
    pip install --no-cache-dir -r /app/requirements.txt

    echo "Konfiguriere Zertifikate..."
    mkdir -p ~/.pip
    cp /security/pip.conf ~/.pip/pip.conf
    cat /security/cacerts.pem >> $(python3 -m certifi)

    echo "Starte die Anwendung..."
    python /app/app.py
    
  requirements.txt: |
    flask
    certifi
    psycopg2-binary

  app.py: |
    from flask import Flask, request, jsonify
    from psycopg2 import pool, OperationalError
    
    app = Flask(__name__)
    
    # Connection-Pool initialisieren
    try:
      db_pool = pool.SimpleConnectionPool(
      minconn=1,
      maxconn=10,
      dbname="vector_db",
      user="admin",
      password="admin",
      host="postgres",
      port=5432
      )
      if db_pool:
        print("Connection-Pool erfolgreich erstellt")
    except OperationalError as e:
      print(f"Fehler beim Erstellen des Connection-Pools: {e}")
      db_pool = None
    
    def get_conn():
      conn = db_pool.getconn()
    
      try:
        with conn.cursor() as cur:
          cur.execute("SELECT 1")
      except psycopg2.Error:
        db_pool.putconn(conn, close=True)
        conn = db_pool.getconn()
      return conn
    
    @app.route('/chunks', methods=['GET'])
    def count_chunks():
      if not db_pool:
        return jsonify({"error": "Datenbankverbindung nicht verfügbar"}), 500

      embedding = request.args.get('embedding')
      conn = None
      try:
        conn = get_conn()
        with conn.cursor() as cur:
            if embedding:
                cur.execute("SELECT COUNT(*) FROM vectors WHERE embedding = %s", (embedding,))
            else:
                cur.execute("SELECT COUNT(*) FROM vectors")
            count = cur.fetchone()[0]
        return jsonify({"chunks": count})
      except Exception as e:
        return jsonify({"error": str(e)}), 500
      finally:
        if conn:
          db_pool.putconn(conn)

    @app.route('/chunks/<chunk_id>', methods=['GET'])
    def get_chunk(chunk_id):
      if not db_pool:
        return jsonify({"error": "Datenbankverbindung nicht verfügbar"}), 500

      embedding = request.args.get('embedding')
      conn = None
      try:
        conn = get_conn()
        with conn.cursor() as cur:
            if embedding:
                cur.execute("""
                    SELECT id, chunk_id, embedding, vector, metadata
                    FROM vectors
                    WHERE chunk_id = %s AND embedding = %s
                    LIMIT 1
                """, (chunk_id, embedding))
            else:
                cur.execute("""
                    SELECT id, chunk_id, embedding, vector, metadata
                    FROM vectors
                    WHERE chunk_id = %s
                    LIMIT 1
                """, (chunk_id,))
            row = cur.fetchone()
            if row:
                columns = [desc[0] for desc in cur.description]
                result = dict(zip(columns, row))
                return jsonify(result)
            else:
                return jsonify({"error": "Chunk nicht gefunden"}), 404
      except Exception as e:
        return jsonify({"error": str(e)}), 500
      finally:
        if conn:
          db_pool.putconn(conn)
    
    @app.route('/vectors', methods=['POST'])
    def store_vector():
        if not db_pool:
          return jsonify({"error": "Datenbankverbindung nicht verfügbar"}), 500

        data = request.json
        chunk_id = data['chunk_id']
        embedding = data['embedding']
        vector = data['vector']
        metadata = data['metadata']
    
        conn = None
        try:
            conn = get_conn()
    
            with conn.cursor() as cur:
                cur.execute("""
                    DELETE FROM vectors
                    WHERE chunk_id = %s AND embedding = %s
                """, (chunk_id, embedding))
                cur.execute("""
                    INSERT INTO vectors (chunk_id, embedding, vector, metadata)
                    VALUES (%s, %s, %s, %s)
                """, (chunk_id, embedding, vector, metadata))
                conn.commit()
            return jsonify({"message": "Vector stored successfully"}), 201
        except Exception as e:
            return jsonify({"error": str(e)}), 500
        finally:
            if conn:
                db_pool.putconn(conn)
    
    
    @app.route('/search', methods=['POST'])
    def search_vectors():
        if not db_pool:
          return jsonify({"error": "Datenbankverbindung nicht verfügbar"}), 500

        data = request.json
        query_vector = data['vector']
        num_results = data.get('num_results', 10)
        metric = data.get('metric', 'euclidean')
        embedding_filter = data.get('embedding')
    
        if metric not in ['euclidean', 'cosine']:
            return jsonify({"error": "Only 'euclidean' and 'cosine' metrics are supported"}), 400

        conn = None
        try:
            conn = get_conn()
    
            with conn.cursor() as cur:
                distance_operator = '<->' if metric == 'euclidean' else '<#>'
                if embedding_filter:
                    sql_query = f"""
                        SELECT id, chunk_id, embedding, vector, metadata, vector {distance_operator} %s::VECTOR AS distance 
                        FROM vectors
                        WHERE embedding = %s
                        ORDER BY vector {distance_operator} %s::VECTOR
                        LIMIT %s
                    """
                    cur.execute(sql_query, (query_vector, embedding_filter, query_vector, num_results))
                else:
                    sql_query = f"""
                        SELECT id, chunk_id, embedding, vector, metadata, vector {distance_operator} %s::VECTOR AS distance
                        FROM vectors
                        ORDER BY vector {distance_operator} %s::VECTOR
                        LIMIT %s
                    """
                    cur.execute(sql_query, (query_vector, query_vector, num_results))
                columns = [desc[0] for desc in cur.description]
                results = [dict(zip(columns, row)) for row in cur.fetchall()]

            return jsonify(results)
        except Exception as e:
            return jsonify({"error": str(e)}), 500
        finally:
            if conn:
                db_pool.putconn(conn)
        
    
    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5500)